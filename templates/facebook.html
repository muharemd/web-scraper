<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; line-height: 1.6; color: #333; background-color: #f5f5f5; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 2px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #1877f2 0%, #0d5abf 100%); color: white; padding: 2rem; text-align: center; }
        .header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .header p { opacity: 0.9; }
        .section { padding: 1.5rem 2rem; border-bottom: 1px solid #e9ecef; }
        .section h5 { margin: 0 0 1rem 0; color: #1877f2; font-weight: 700; }
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
        .btn-primary { background: #1877f2; color: white; }
        .btn-primary:hover { background: #0d5abf; }
        .btn-warning { background: #ed8936; color: white; }
        .btn-warning:hover { background: #dd6b20; }
        .btn-danger { background: #f56565; color: white; }
        .btn-danger:hover { background: #e53e3e; }
        .btn-secondary { background: #718096; color: white; }
        .btn-secondary:hover { background: #4a5568; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .footer { text-align: center; padding: 1.5rem 2rem; color: #718096; font-size: 0.875rem; border-top: 1px solid #e9ecef; background: #f8f9fa; }
        @media (max-width: 768px) {
            body { padding: 8px; }
            .section { padding: 1rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📘 Facebook Tools</h1>
        <p>Manage Facebook pages and run Apify scrapes</p>
    </div>

    <!-- Top actions -->
    <div class="section" style="background:#f8f9fa; display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center; padding:1rem 2rem;">
        <a href="/" class="btn btn-secondary">← Back to Dashboard</a>
        <button id="apifyRunBtn" class="btn btn-warning" onclick="runApifyScrape()">📘 Run Facebook Scrape (Apify)</button>
    </div>
    <div id="apifyStatus" style="padding:0.5rem 2rem; color:#4a5568; font-size:0.95rem; min-height:1.5rem;"></div>

    <!-- Facebook Pages Management -->
    <div class="section">
        <h5>📚 Facebook Pages for Apify</h5>
        <div style="display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center; margin-bottom:0.75rem;">
            <input id="fbPageName" type="text" placeholder="Page name (e.g. Bihać Danas)"
                   style="flex:1; min-width:200px; padding:0.6rem 0.75rem; border:1px solid #cbd5e0; border-radius:6px;">
            <input id="fbPageUrl" type="text" placeholder="https://www.facebook.com/page"
                   style="flex:2; min-width:260px; padding:0.6rem 0.75rem; border:1px solid #cbd5e0; border-radius:6px;">
            <button id="fbAddBtn" class="btn btn-primary" onclick="addFacebookPage()">➕ Add Page</button>
            <button id="fbAddScanBtn" class="btn btn-warning" onclick="addFacebookPage(true)">➕ Add + Scan Now</button>
        </div>
        <div style="color:#718096; font-size:0.88rem; margin-bottom:0.5rem;">
            Sources loaded from: <code>.fb_pages.json</code> (manual) and <code>.fb_pages_preconfigured.json</code> (preconfigured).
        </div>
        <div id="fbPagesStatus" style="margin-bottom:0.5rem; color:#4a5568; font-size:0.95rem;"></div>
        <div id="fbPagesList"></div>
    </div>

    <div class="footer">
        Facebook Tools • {{ now.strftime('%Y-%m-%d %H:%M') if now is defined else '' }}
    </div>
</div>

<script>
    function escapeHtml(value) {
        return (value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderFacebookPages(pages) {
        const list = document.getElementById('fbPagesList');
        if (!pages || pages.length === 0) {
            list.innerHTML = '<div style="color:#718096; font-size:0.95rem;">No pages added yet.</div>';
            return;
        }

        const html = pages.map((page) => {
            const encodedId = encodeURIComponent(page.id || '');
            const isPreconfigured = page.source_file === 'preconfigured';
            const statusBadge = page.enabled
                ? '<span class="badge bg-success">Enabled</span>'
                : '<span class="badge bg-secondary">Disabled</span>';
            const sourceBadge = isPreconfigured
                ? '<span class="badge bg-light text-dark">Preconfigured</span>'
                : '<span class="badge bg-info text-dark">Manual</span>';
            const toggleButton = isPreconfigured
                ? '<button class="btn btn-sm btn-light" disabled title="Edit .fb_pages_preconfigured.json">Toggle</button>'
                : `<button class="btn btn-sm btn-light" onclick="toggleFacebookPage('${encodedId}')">Toggle</button>`;
            const deleteButton = isPreconfigured
                ? '<button class="btn btn-sm btn-danger" disabled title="Edit .fb_pages_preconfigured.json">Delete</button>'
                : `<button class="btn btn-sm btn-danger" onclick="deleteFacebookPage('${encodedId}')">Delete</button>`;

            return `
                <div style="border:1px solid #e2e8f0; border-radius:8px; padding:0.7rem 0.8rem; margin-bottom:0.55rem; display:flex; gap:0.6rem; flex-wrap:wrap; align-items:center; justify-content:space-between;">
                    <div style="min-width:220px; flex:1;">
                        <div style="font-weight:600; color:#2d3748;">${escapeHtml(page.name || '')}</div>
                        <a href="${escapeHtml(page.url || '')}" target="_blank" style="font-size:0.9rem; color:#1877f2; text-decoration:none;">${escapeHtml(page.url || '')}</a>
                    </div>
                    <div style="display:flex; gap:0.45rem; align-items:center; flex-wrap:wrap;">
                        ${sourceBadge}
                        ${statusBadge}
                        ${toggleButton}
                        ${deleteButton}
                    </div>
                </div>
            `;
        }).join('');

        list.innerHTML = html;
    }

    function setFbStatus(message, color) {
        const status = document.getElementById('fbPagesStatus');
        status.style.color = color || '#4a5568';
        status.textContent = message;
    }

    function loadFacebookPages() {
        fetch('/api/facebook-pages')
            .then(async (response) => {
                const data = await response.json();
                if (!response.ok || data.status !== 'success') throw new Error(data.message || 'Failed to load pages');
                return data;
            })
            .then((data) => renderFacebookPages(data.pages || []))
            .catch((error) => setFbStatus('Error loading pages: ' + error.message, '#c53030'));
    }

    function addFacebookPage(runAfterAdd = false) {
        const nameInput = document.getElementById('fbPageName');
        const urlInput = document.getElementById('fbPageUrl');
        const addBtn = document.getElementById('fbAddBtn');
        const addScanBtn = document.getElementById('fbAddScanBtn');

        const name = (nameInput.value || '').trim();
        const url = (urlInput.value || '').trim();

        if (!name || !url) { setFbStatus('Both page name and URL are required.', '#c53030'); return; }

        addBtn.disabled = true; addBtn.textContent = '⏳ Adding...';
        addScanBtn.disabled = true; addScanBtn.textContent = '⏳ Adding...';
        setFbStatus('Adding page...', '#4a5568');

        fetch('/api/facebook-pages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, url, enabled: true }),
        })
        .then(async (response) => {
            const data = await response.json();
            if (!response.ok || data.status !== 'success') throw new Error(data.message || 'Add page failed');
            return data;
        })
        .then((data) => {
            setFbStatus(data.message || 'Page added.', '#2f855a');
            nameInput.value = ''; urlInput.value = '';
            loadFacebookPages();
            if (runAfterAdd) setTimeout(() => runApifyScrape(), 200);
        })
        .catch((error) => setFbStatus('Error: ' + error.message, '#c53030'))
        .finally(() => {
            addBtn.disabled = false; addBtn.textContent = '➕ Add Page';
            addScanBtn.disabled = false; addScanBtn.textContent = '➕ Add + Scan Now';
        });
    }

    function toggleFacebookPage(encodedPageId) {
        const pageId = decodeURIComponent(encodedPageId || '');
        fetch('/api/facebook-pages/' + pageId + '/toggle', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
        })
        .then(async (response) => {
            const data = await response.json();
            if (!response.ok || data.status !== 'success') throw new Error(data.message || 'Toggle failed');
            return data;
        })
        .then((data) => { setFbStatus(data.message || 'Page updated.', '#2f855a'); loadFacebookPages(); })
        .catch((error) => setFbStatus('Error: ' + error.message, '#c53030'));
    }

    function deleteFacebookPage(encodedPageId) {
        const pageId = decodeURIComponent(encodedPageId || '');
        if (!confirm('Remove this Facebook page source from dashboard list?')) return;
        fetch('/api/facebook-pages/' + pageId, { method: 'DELETE' })
        .then(async (response) => {
            const data = await response.json();
            if (!response.ok || data.status !== 'success') throw new Error(data.message || 'Delete failed');
            return data;
        })
        .then((data) => { setFbStatus(data.message || 'Page removed.', '#2f855a'); loadFacebookPages(); })
        .catch((error) => setFbStatus('Error: ' + error.message, '#c53030'));
    }

    function runApifyScrape() {
        const btn = document.getElementById('apifyRunBtn');
        const status = document.getElementById('apifyStatus');

        btn.disabled = true; btn.textContent = '⏳ Running Apify...';
        status.style.color = '#4a5568';
        status.textContent = 'Starting Apify scrape...';

        fetch('/api/run-apify-scrape', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
        })
        .then(async (response) => {
            const data = await response.json();
            if (!response.ok || data.status !== 'success') throw new Error(data.message || 'Apify scrape failed');
            return data;
        })
        .then((data) => {
            status.style.color = '#2f855a';
            status.textContent = data.message;
        })
        .catch((error) => {
            status.style.color = '#c53030';
            status.textContent = 'Error: ' + error.message;
        })
        .finally(() => {
            btn.disabled = false;
            btn.textContent = '📘 Run Facebook Scrape (Apify)';
        });
    }

    document.addEventListener('DOMContentLoaded', loadFacebookPages);
</script>
</body>
</html>
